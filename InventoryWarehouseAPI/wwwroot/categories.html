<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Категории</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<nav class="bg-green-800 text-white p-4">
    <div class="container mx-auto flex flex-wrap gap-4">
        <a href="dashboard.html" class="font-bold">Главная</a>
        <a href="warehouses.html">Склады</a>
        <a href="categories.html" class="underline">Категории</a>
    </div>
</nav>

<div class="container mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Список категорий</h1>
        <a href="category-create.html" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">+ Добавить</a>
    </div>

    <!-- Фильтры -->
    <div class="bg-white p-4 rounded shadow mb-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Поиск по названию</label>
                <input type="text" id="search" placeholder="Введите текст..." class="w-full p-2 border rounded" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Только видимые</label>
                <div class="flex items-center mt-1">
                    <label><input type="checkbox" id="visible-only" class="mr-2" />Да</label>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Сортировка</label>
                <select id="sort" class="w-full p-2 border rounded">
                    <option value="name">Название (А-Я)</option>
                    <option value="name desc">Название (Я-А)</option>
                    <option value="createdAt">Сначала старые</option>
                    <option value="createdAt desc">Сначала новые</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Таблица -->
    <div class="bg-white rounded shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead>
            <tr>
                <th class="px-6 py-3 text-left font-medium text-gray-700">Название</th>
                <th class="px-6 py-3 text-left font-medium text-gray-700">Описание</th>
                <th class="px-6 py-3 text-left font-medium text-gray-700">Видима</th>
                <th class="px-6 py-3 text-left font-medium text-gray-700">Действия</th>
            </tr>
            </thead>
            <tbody id="table-body" class="divide-y"></tbody>
        </table>
    </div>

    <!-- Пагинация -->
    <div id="pagination" class="mt-4 flex justify-center gap-2"></div>
</div>

<div id="toast-container" class="fixed top-4 right-4 space-y-2 z-50"></div>

<script>
    const API = '/api';
    const API_URL = 'http://localhost:5263/api/categories/filtered';
    const PAGE_SIZE = 5;

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function getUrlParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name) || '';
    }

    function updateUrl(search, isVisible, sortBy, page) {
        const params = new URLSearchParams();
        if (search) params.set('search', search);
        if (isVisible) params.set('isVisible', 'true');
        if (sortBy && sortBy !== 'name') params.set('sortBy', sortBy);
        if (page > 1) params.set('page', page);
        window.history.replaceState(null, '', `?${params.toString()}`);
    }

    async function loadCategories() {
        const search = getUrlParam('search');
        const isVisible = getUrlParam('isVisible') === 'true';
        const sortBy = getUrlParam('sortBy') || 'name';
        const page = parseInt(getUrlParam('page')) || 1;

        // Восстанавливаем UI
        document.getElementById('search').value = search;
        document.getElementById('visible-only').checked = isVisible;
        document.getElementById('sort').value = sortBy;

        try {
            const params = new URLSearchParams();
            if (search) params.set('search', search);
            if (isVisible) params.set('isVisible', 'true'); // ← Только если true!
            if (sortBy && sortBy !== 'name') params.set('sortBy', sortBy);
            params.set('page', page);
            params.set('pageSize', PAGE_SIZE);

            const url = `${API_URL}?${params.toString()}`;
            const res = await fetch(url);
            const data = await res.json();

            document.getElementById('table-body').innerHTML = data.items.map(c => `
            <tr>
                <td class="px-6 py-4 font-medium">${escapeHtml(c.name)}</td>
                <td class="px-6 py-4 text-gray-600">${escapeHtml(c.description) || '—'}</td>
                <td class="px-6 py-4">${c.isVisible ? '✅ Да' : '❌ Нет'}</td>
                <td class="px-6 py-4">
                    <button onclick="deleteCategory('${c.id}')" class="text-red-600 hover:underline text-sm">Удалить</button>
                </td>
            </tr>
        `).join('');

            // Пагинация
            let pg = '';
            for (let i = 1; i <= data.totalPages; i++) {
                pg += `<button onclick="goToPage(${i})" class="px-3 py-1 border rounded ${i === page ? 'bg-green-600 text-white' : ''}">${i}</button>`;
            }
            document.getElementById('pagination').innerHTML = pg;

        } catch (e) {
            console.error('Ошибка загрузки:', e);
            document.getElementById('table-body').innerHTML = `<tr><td colspan="4" class="text-center text-red-600">Ошибка загрузки</td></tr>`;
        }
    }

    function goToPage(page) {
        const search = document.getElementById('search').value;
        const isVisible = document.getElementById('visible-only').checked;
        const sortBy = document.getElementById('sort').value;
        updateUrl(search, isVisible, sortBy, page);
        loadCategories();
    }

    // Функции для кнопок (заглушки)
    function editCategory(id) {
        alert('Редактирование категории ' + id + ' — пока не реализовано');
    }
    async function deleteCategory(id) {
        if (!confirm('Удалить категорию?')) {
            return;
        }

        try {
            // Отправляем DELETE-запрос
            const response = await fetch(`http://localhost:5263/api/categories/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                // Успешно удалено — обновляем список
                await loadCategories();
            } else {
                alert(`Не удалось удалить категорию. Ошибка: ${response.status}`);
            }
        } catch (error) {
            console.error('Ошибка при удалении категории:', error);
            alert('Произошла ошибка при удалении. Проверьте подключение.');
        }
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        loadCategories();

        let searchTimer;
        document.getElementById('search').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                updateUrl(e.target.value, document.getElementById('visible-only').checked, document.getElementById('sort').value, 1);
                loadCategories();
            }, 300);
        });

        document.getElementById('visible-only').addEventListener('change', (e) => {
            const search = document.getElementById('search').value;
            const isVisible = e.target.checked;
            const sortBy = document.getElementById('sort').value;
            updateUrl(search, isVisible, sortBy, 1);
            loadCategories();
        });

        document.getElementById('sort').addEventListener('change', (e) => {
            const search = document.getElementById('search').value;
            const isVisible = document.getElementById('visible-only').checked;
            const sortBy = e.target.value;
            updateUrl(search, isVisible, sortBy, 1);
            loadCategories();
        });
    });

    window.goToPage = goToPage;
</script>

</body>
</html>
