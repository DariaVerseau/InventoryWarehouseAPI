<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Склады</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<nav class="bg-blue-800 text-white p-4">
    <div class="container mx-auto flex flex-wrap gap-4">
        <a href="dashboard.html" class="font-bold">Главная</a>
        <a href="warehouses.html" class="underline">Склады</a>
        <a href="categories.html">Категории</a>
    </div>
</nav>

<div class="container mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Список складов</h1>
        <a href="warehouse-create.html" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">+ Добавить</a>
    </div>

    <!-- Фильтры -->
    <div class="bg-white p-4 rounded shadow mb-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Поиск по названию или адресу</label>
                <input type="text" id="search" placeholder="Введите текст..." class="w-full p-2 border rounded" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Сортировка</label>
                <select id="sort" class="w-full p-2 border rounded">
                    <option value="name">Название (А-Я)</option>
                    <option value="name desc">Название (Я-А)</option>
                    <option value="location">Адрес (А-Я)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Таблица -->
    <div class="bg-white rounded shadow overflow-hidden">
        <table class="min-w-full divide-y">
            <thead class="bg-gray-100">
            <tr>
                <th class="px-6 py-3 text-left font-medium text-gray-700">Название</th>
                <th class="px-6 py-3 text-left font-medium text-gray-700">Адрес</th>
                <th class="px-6 py-3 text-left font-medium text-gray-700">Действия</th>
            </tr>
            </thead>
            <tbody id="table-body" class="divide-y"></tbody>
        </table>
    </div>

    <!-- Пагинация -->
    <div id="pagination" class="mt-4 flex justify-center gap-2"></div>
</div>

<div id="toast-container" class="fixed top-4 right-4 space-y-2 z-50"></div>

<script>
    const API = '/api';
    const API_URL = 'http://localhost:5263/api/warehouses/filtered';
    const PAGE_SIZE = 5;

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function getUrlParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name) || '';
    }

    function updateUrl(search, sortBy, page) {
        const params = new URLSearchParams();
        if (search) params.set('search', search);
        if (sortBy && sortBy !== 'name') params.set('sortBy', sortBy);
        if (page > 1) params.set('page', page);
        window.history.replaceState(null, '', `?${params.toString()}`);
    }

    async function loadWarehouses() {
        const search = getUrlParam('search');
        const sortBy = getUrlParam('sortBy') || 'name';
        const page = parseInt(getUrlParam('page')) || 1;

        document.getElementById('search').value = search;
        document.getElementById('sort').value = sortBy;

        try {
            const params = new URLSearchParams();
            if (search) params.set('search', search);
            if (sortBy && sortBy !== 'name') params.set('sortBy', sortBy);
            params.set('page', page);
            params.set('pageSize', PAGE_SIZE);

            const url = `${API_URL}?${params.toString()}`;
            const res = await fetch(url, {
                method: 'GET',
                cache: 'no-store' 
            });
            const data = await res.json();

            document.getElementById('table-body').innerHTML = data.items.map(w => `
        <tr>
          <td class="px-6 py-4 font-medium">${escapeHtml(w.name)}</td>
          <td class="px-6 py-4 text-gray-600">${escapeHtml(w.location) || '—'}</td>
          <td class="px-6 py-4">${new Date(w.createdAt).toLocaleString('ru-RU')}</td>
          <td class="px-6 py-4">
             <button onclick="deleteWarehouse('${w.id}')" class="text-red-600 hover:underline text-sm">Удалить</button>
          </td>
        </tr>
      `).join('');

            let pg = '';
            for (let i = 1; i <= data.totalPages; i++) {
                pg += `<button onclick="goToPage(${i})" class="px-3 py-1 border rounded ${i === page ? 'bg-green-600 text-white' : ''}">${i}</button>`;
            }
            document.getElementById('pagination').innerHTML = pg;

        } catch (e) {
            console.error('Ошибка загрузки складов:', e);
            document.getElementById('table-body').innerHTML = `<tr><td colspan="4" class="text-center text-red-600">Ошибка загрузки</td></tr>`;
        }
    }

    function goToPage(page) {
        const search = document.getElementById('search').value;
        const sortBy = document.getElementById('sort').value;
        updateUrl(search, sortBy, page);
        loadWarehouses();
    }

    const deleteWarehouse = async (id) => {
        if (!confirm('Удалить склад? Все связанные остатки будут удалены.')) return;

        try {
            const response = await fetch(`/api/warehouses/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                // Успешно удалено → обновляем таблицу
                await loadWarehouses();
            } else {
                alert('Не удалось удалить склад. Статус: ' + response.status);
            }
        } catch (error) {
            console.error('Ошибка при удалении:', error);
            alert('Произошла ошибка при удалении склада.');
        }
    };

    // === ЕДИНСТВЕННЫЙ DOMContentLoaded ===
    document.addEventListener('DOMContentLoaded', () => {
        loadWarehouses();

        // Поиск с debounce
        let searchTimer;
        document.getElementById('search').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                updateUrl(e.target.value, document.getElementById('sort').value, 1);
                loadWarehouses();
            }, 300);
        });

        // Сортировка
        document.getElementById('sort').addEventListener('change', (e) => {
            updateUrl(document.getElementById('search').value, e.target.value, 1);
            loadWarehouses();
        });
    });

    window.goToPage = goToPage;
</script>

</body>
</html>
